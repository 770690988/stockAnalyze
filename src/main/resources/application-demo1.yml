server:
  port: 8082
  error:
    include-message: always
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/stock_analyze
    username: root
    password: xxxxxxxxx
    hikari:
      # 连接池最大生存时间，建议设置为比数据库 wait_timeout 短 30-60 秒
      # 这里设置为 5 分钟 (300000 毫秒) 作为保守策略，可根据实际情况调整
      max-lifetime: 300000
      # 连接超时时间
      connection-timeout: 30000
      # 空闲连接超时时间，应小于 max-lifetime
      idle-timeout: 60000
      # 最小空闲连接数
      minimum-idle: 5
      # 最大连接池大小
      maximum-pool-size: 10
  task:
    execution:
      pool:
        max-size: 10
        core-size: 3
        keep-alive: 230s
        queue-capacity: 1000
      thread-name-prefix: thread
  #  main:
  #    allow-bean-definition-overriding: true
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 开发期间打印SQL
  global-config:
    db-config:
      logic-delete-field: deleted  # 如果有逻辑删除字段

  redis:
    port: 6379
    jedis:
      pool:
        min-idle: 0
        max-idle: 8
        max-active: 80
        max-wait: 30000
        timeout: 3000

#通知信息
notification:
  baseUrl: https://20.push2.eastmoney.com/api/qt/clist/

localstorage:
  tempRoute: /data/service/epidemic

backup:
  container-name: mysql-server
  db-name: stock_analyze
  split-size: 40
  backup-dir: backupdir
  split-path: splitpath